[defaults]
inventory            = inventories/production.yml
# playbook を playbooks/ 配下に置いているため、既定の探索パス（playbook と同階層の roles/）
# では roles/ が見つからない。cwd（infra/ansible）からの相対で明示する。
# → このディレクトリから ansible-playbook を実行すること。
roles_path           = roles
remote_user          = ec2-user
host_key_checking    = True
interpreter_python   = auto_silent
stdout_callback      = yaml
retry_files_enabled  = False
# 秘密（DBパスワード・AUTH_SECRET）を扱うタスクには個別に no_log: true を指定しているが、
# 事故時の影響を減らすため既定の差分表示も抑止する。
no_log               = False

[privilege_escalation]
become_method = sudo

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
