---
# Node.js / pnpm / PM2 本体の導入。旧 user-data.sh.tpl の該当部に相当する。

# 以降の when 条件がこの結果に依存するため、--check でも必ず実行する（読み取り専用）。
- name: 導入済みの Node.js バージョンを確認する
  ansible.builtin.command: node -v
  register: node_version_check
  check_mode: false
  changed_when: false
  failed_when: false

# AL2023 の dnf 標準リポジトリの nodejs は既定で古い系列が入りうるため、
# NodeSource で系列を明示する。
- name: NodeSource リポジトリを登録する
  ansible.builtin.shell: >-
    set -o pipefail &&
    curl -fsSL https://rpm.nodesource.com/setup_{{ node_major_version }}.x | bash -
  args:
    executable: /bin/bash
  when: node_version_check.rc != 0 or not node_version_check.stdout.startswith('v' ~ node_major_version ~ '.')
  changed_when: true

- name: Node.js を導入する
  ansible.builtin.dnf:
    name: nodejs
    state: present
  when: node_version_check.rc != 0 or not node_version_check.stdout.startswith('v' ~ node_major_version ~ '.')

# --check では導入自体がスキップされるため、未導入時はこの検証も飛ばす。
- name: 導入後の Node.js バージョンを検証する
  ansible.builtin.command: node -v
  register: node_version_after
  check_mode: false
  changed_when: false
  failed_when: not node_version_after.stdout.startswith('v' ~ node_major_version ~ '.')
  when: not (ansible_check_mode and node_version_check.rc != 0)

- name: corepack を有効化する
  ansible.builtin.command: corepack enable
  changed_when: false
  when: not ansible_check_mode

- name: 導入済みの pnpm バージョンを確認する
  ansible.builtin.command: pnpm -v
  register: pnpm_version_check
  check_mode: false
  changed_when: false
  failed_when: false
  environment:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

- name: pnpm を packageManager 指定のバージョンへ固定する
  ansible.builtin.command: "corepack prepare pnpm@{{ pnpm_version }} --activate"
  when: pnpm_version_check.stdout | default('') | trim != pnpm_version
  changed_when: true

- name: PM2 をグローバル導入する
  ansible.builtin.command: npm install -g pm2
  args:
    creates: /usr/lib/node_modules/pm2/bin/pm2
