name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# CIに必要な環境変数（.env.testはgitignore対象でCIには存在しないため、
# vitest.config.tsのloadEnv({ path: ".env.test" })は無視され、
# ここでGitHub Actionsのenv:として渡す値がそのまま使われる）
# ENABLE_TEST_ENDPOINTS/TEST_CLEANUP_SECRET/DISABLE_RATE_LIMIT_FOR_TESTS はここではなく
# e2e ジョブのみに設定する（/api/test/cleanup・レート制限バイパスに必要な一方、
# testジョブ〔vitest〕にまで効くとPhase 5-Dのレート制限テスト自体が無効化されてしまうため）
env:
  DATABASE_URL: mysql://tripdiary:tripdiary@127.0.0.1:3307/tripdiary_test
  AUTH_SECRET: ci-dummy-auth-secret-not-for-production

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    # 6-A2で@node-rs/bcrypt（napi-rsのネイティブアドオン）を導入したため、
    # Next.jsのバンドル・サーバーコンポーネントと問題なく組み合わさることを
    # CIで保証する目的で新設。typecheckとは依存関係が重複するが、独立ジョブに
    # することで並列実行でき、失敗時に型エラーかビルドエラーかを切り分けやすい。
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  test:
    runs-on: ubuntu-latest
    services:
      mysql-test:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tripdiary_test
          MYSQL_USER: tripdiary
          MYSQL_PASSWORD: tripdiary
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm prisma:migrate:test は dotenv-cli が .env.test の不在でエラー終了するため
      # CIでは使わず、DATABASE_URL を上記env:から渡した上で直接呼ぶ
      - run: pnpm prisma migrate deploy
      - run: pnpm test:coverage

  e2e:
    runs-on: ubuntu-latest
    # Phase 5-C-2で「TimeLine方式」を採用：ブランチ保護の必須ステータスチェックには含めず
    # マージはブロックしないが、continue-on-error は付けず失敗時は赤く表示する
    # （continue-on-errorは失敗を握り潰しワークフロー全体が成功寄りに見えてしまい、
    #   直近のCI安定性実績をGitHub UI上で追いにくくなるため採用しない）
    env:
      ENABLE_TEST_ENDPOINTS: "true"
      TEST_CLEANUP_SECRET: ci-dummy-test-cleanup-secret-not-for-production
      DISABLE_RATE_LIMIT_FOR_TESTS: "true"
      # dark-theme-post-forms.spec.tsが画像アップロードAPIをモックしつつ、投稿作成APIの
      # 所有権検証（uploads/{userId}/...形式のS3 URLのみ許可）とNext Imageの許可ホストを
      # 満たすために必要なダミー値。アップロードAPI自体はブラウザ側でモックするため、
      # 実際のAWS認証情報・S3バケットは不要
      AWS_REGION: ap-northeast-1
      AWS_S3_BUCKET_NAME: tripdiary-e2e-dummy-bucket
      # 多くのspecがUIログインをbeforeEachで行うため、コストを下げてハッシュ計算量を
      # 減らし実行時間を短縮する（Phase 5-D2、詳細は実装計画書）。6-A2で@node-rs/bcrypt
      # へ置き換え済みのためメインスレッドはブロックしないが、コストに応じたCPU時間
      # そのものは変わらないため、テスト高速化の目的でコストは引き続き下げておく。
      # 本番環境変数には絶対に設定しないこと（コストを下げるとパスワードの総当たり
      # 耐性が下がるため）。
      BCRYPT_COST: "4"
    services:
      mysql-test:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tripdiary_test
          MYSQL_USER: tripdiary
          MYSQL_PASSWORD: tripdiary
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # webServerがE2E開始時に`pnpm build`を実行するため、Next.jsの増分ビルドキャッシュだけを復元する。
      # `.next`全体を再利用するとビルド生成物と環境変数・ソースの不整合を招くため、キャッシュ対象は
      # Next.js自身が有効性を判定する`.next/cache`に限定する。
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'next.config.ts', 'src/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma migrate deploy
      # Playwrightのブラウザ本体は大きく、毎回の再取得を避ける。
      # pnpm-lock.yamlをキーにすることで、Playwright更新時は新しいChromiumを取得する。
      # OS依存ライブラリ(--with-depsが入れるlibnss3等)は~/.cache/ms-playwrightに含まれず、
      # actions/cacheでは復元できない（ランナーは毎回新規VMのため）。ブラウザ本体のキャッシュが
      # ヒットしてもOS依存ライブラリの導入は毎回必要なため、install-depsは常に実行する。
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright OS dependencies
        run: pnpm exec playwright install-deps chromium
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - run: pnpm playwright test --project=e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
