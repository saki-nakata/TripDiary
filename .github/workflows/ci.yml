name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# CIに必要な環境変数（.env.testはgitignore対象でCIには存在しないため、
# vitest.config.tsのloadEnv({ path: ".env.test" })は無視され、
# ここでGitHub Actionsのenv:として渡す値がそのまま使われる）
# ENABLE_TEST_ENDPOINTS はここではなく e2e ジョブのみに設定する
# （/api/test/cleanup 用に必要な一方、testジョブ〔vitest〕にまで効くとPhase 5-Dの
# レート制限テスト自体が無効化されてしまうため）
env:
  DATABASE_URL: mysql://tripdiary:tripdiary@127.0.0.1:3307/tripdiary_test
  AUTH_SECRET: ci-dummy-auth-secret-not-for-production

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    services:
      mysql-test:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tripdiary_test
          MYSQL_USER: tripdiary
          MYSQL_PASSWORD: tripdiary
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm prisma:migrate:test は dotenv-cli が .env.test の不在でエラー終了するため
      # CIでは使わず、DATABASE_URL を上記env:から渡した上で直接呼ぶ
      - run: pnpm prisma migrate deploy
      - run: pnpm test:coverage

  e2e:
    runs-on: ubuntu-latest
    # Phase 5-C-2で「TimeLine方式」を採用：ブランチ保護の必須ステータスチェックには含めず
    # マージはブロックしないが、continue-on-error は付けず失敗時は赤く表示する
    # （continue-on-errorは失敗を握り潰しワークフロー全体が成功寄りに見えてしまい、
    #   直近のCI安定性実績をGitHub UI上で追いにくくなるため採用しない）
    env:
      ENABLE_TEST_ENDPOINTS: "true"
      # bcryptjs（純JS実装）はコストに応じてメインスレッドをブロックする。
      # 多くのspecがUIログインをbeforeEachで行うため、本番同様のコスト12のままでは
      # 並列ワーカー下でCPU競合しフレークの一因になっていた（Phase 5-D2、詳細は実装計画書）。
      # 本番環境変数には絶対に設定しないこと。
      BCRYPT_COST: "4"
    services:
      mysql-test:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tripdiary_test
          MYSQL_USER: tripdiary
          MYSQL_PASSWORD: tripdiary
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma migrate deploy
      # Playwrightのブラウザ本体は大きく、毎回の再取得を避ける。
      # pnpm-lock.yamlをキーにすることで、Playwright更新時は新しいChromiumを取得する。
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm playwright test --project=e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
